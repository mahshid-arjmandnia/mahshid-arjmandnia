
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecoprint | Mahshid arjmandnia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="home portfolio-page">

<nav class="portfolio-home-link" dir="ltr">
  <a href="portfolio.html">← HOME</a>
</nav>

    <h1 class="category-title">Ecoprint</h1>

    <section class="portfolio-gallery">

      <article class="artwork-item">
        <button class="artwork-square" type="button"
          data-artwork="ecoprint-1.jpg"
          data-alt="Ecoprint artwork 1">
          <img src="ecoprint-1.jpg" alt="Ecoprint artwork 1">
        </button>
<div class="artwork-description">
  <p>Technique: papermaking •</p>
  <p>Size: 42 × 30 •</p>
  <p>Available •</p>
</div>
      </article>

      <article class="artwork-item">
        <button class="artwork-square" type="button"
          data-artwork="ecoprint-3.jpg"
          data-alt="Ecoprint artwork 3">
          <img src="ecoprint-3.jpg" alt="Ecoprint artwork 3">
        </button>
<div class="artwork-description">
  <p>Technique: papermaking •</p>
  <p>Size: 42 × 30 •</p>
  <p>Available •</p>
</div>
      </article>

      <article class="artwork-item">
        <button class="artwork-square" type="button"
          data-artwork="ecoprint-2.jpg"
          data-alt="Ecoprint artwork 2">
          <img src="ecoprint-2.jpg" alt="Ecoprint artwork 2">
        </button>
<div class="artwork-description">
  <p>Technique: papermaking •</p>
  <p>Size: 42 × 30 •</p>
  <p>Available •</p>
</div>
      </article>
      
    </section>

    <div class="artwork-lightbox" id="artworkLightbox" aria-hidden="true">
      <button class="lightbox-close" type="button">&times;</button>
      <img class="lightbox-image" id="lightboxImage" src="" alt="">
    </div>

  </main>

  <script>
    const lightbox = document.getElementById("artworkLightbox");
    const lightboxImage = document.getElementById("lightboxImage");

    document.querySelectorAll(".artwork-square").forEach((artwork) => {
      artwork.addEventListener("click", () => {
        lightboxImage.src = artwork.dataset.artwork;
        lightboxImage.alt = artwork.dataset.alt;
        lightbox.classList.add("is-open");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.classList.add("lightbox-active");
      });
    });

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      lightbox.setAttribute("aria-hidden", "true");
      document.body.classList.remove("lightbox-active");
      lightboxImage.src = "";
    }

    document.querySelector(".lightbox-close")
      .addEventListener("click", closeLightbox);

    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeLightbox();
    });
    document.querySelectorAll(".artwork-square").forEach((artwork) => {
  artwork.addEventListener("contextmenu", (event) => {
    event.preventDefault();
  });
});
    // Disable image context menu in gallery and lightbox
document.addEventListener("contextmenu", (event) => {
  if (
    event.target.closest(".artwork-square") ||
    event.target.closest(".artwork-lightbox")
  ) {
    event.preventDefault();
  }
});

// Prevent dragging images
document.querySelectorAll(".artwork-square img, .lightbox-image")
  .forEach((img) => {
    img.setAttribute("draggable", "false");
    img.addEventListener("dragstart", (event) => {
      event.preventDefault();
    });
  });
    
  </script>

</body>
</html>
